[build]
  publish = "."

[[redirects]]
  from = "https://shenavigates.com/*"
  to = "https://amandacarmichaelcoaching.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.shenavigates.com/*"
  to = "https://amandacarmichaelcoaching.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://shenavigates.com/*"
  to = "https://amandacarmichaelcoaching.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.shenavigates.com/*"
  to = "https://amandacarmichaelcoaching.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/journal/success/"
  to = "/journal/success.html"
  status = 200
